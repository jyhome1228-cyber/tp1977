        <h2>1977년부터 생활 위생용품을 만들어온 태평제지</h2>
        <p>태평제지는 1977년 설립 이래 약 50년간 생활 위생용품 분야에서 우수한 품질의 화장지를 제조하여 공급해온 대한민국 화장지 1세대 기업입니다.</p>
        <p>두루마리 화장지, 점보롤, 페이퍼타월, 키친타월, 물티슈 등 다양한 제품을 전자동 설비로 안정적으로 생산하며, 공공기관과 기업 고객 그리고 온라인 시장을 통해 소비자에게 공급하고 있습니다.</p>
